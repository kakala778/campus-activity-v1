<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>活动详情 - 校园活动管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <h1 th:text="${activity.title}">活动详情</h1>
    <p class="message" th:if="${success}" th:text="${success}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <dl>
        <dt>描述</dt><dd th:text="${activity.description}">活动说明</dd>
        <dt>地点</dt><dd th:text="${activity.location}">活动地点</dd>
        <dt>报名截止时间</dt>
        <dd th:text="${#temporals.format(activity.registrationDeadline, 'yyyy-MM-dd HH:mm')}"></dd>
        <dt>开始时间</dt>
        <dd th:text="${#temporals.format(activity.startTime, 'yyyy-MM-dd HH:mm')}"></dd>
        <dt>结束时间</dt>
        <dd th:text="${#temporals.format(activity.endTime, 'yyyy-MM-dd HH:mm')}"></dd>
        <dt>人数上限</dt><dd th:text="${activity.capacity}">30</dd>
        <dt>当前报名人数</dt>
        <dd th:text="${registrationStatus.registrationCount + ' / ' + activity.capacity}">0 / 30</dd>
    </dl>

    <p th:if="${registrationStatus.alreadyRegistered}">已报名</p>
    <p th:if="${!registrationStatus.alreadyRegistered and registrationStatus.deadlinePassed}">报名已截止</p>
    <p th:if="${!registrationStatus.alreadyRegistered and !registrationStatus.deadlinePassed and registrationStatus.full}">
        人数已满
    </p>
    <form th:if="${registrationStatus.canRegister}"
          th:action="@{/student/activities/{id}/register(id=${activity.id})}" method="post">
        <button type="submit">报名</button>
    </form>
    <p><a th:href="@{/student/activities}">返回活动列表</a></p>
</main>
</body>
</html>
