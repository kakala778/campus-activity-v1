<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>可浏览活动 - 校园活动管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <h1>可浏览活动</h1>
    <p>你好，<span th:text="${session.LOGIN_USER_NAME}">学生</span>。</p>
    <p><a th:href="@{/student/registrations}">我的报名</a></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <p th:if="${#lists.isEmpty(activities)}">当前没有已发布活动。</p>
    <table th:unless="${#lists.isEmpty(activities)}">
        <thead>
        <tr>
            <th>标题</th>
            <th>地点</th>
            <th>报名截止时间</th>
            <th>开始时间</th>
            <th>结束时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="activity : ${activities}">
            <td th:text="${activity.title}">活动标题</td>
            <td th:text="${activity.location}">活动地点</td>
            <td th:text="${#temporals.format(activity.registrationDeadline, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${#temporals.format(activity.startTime, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${#temporals.format(activity.endTime, 'yyyy-MM-dd HH:mm')}"></td>
            <td><a th:href="@{/student/activities/{id}(id=${activity.id})}">查看详情</a></td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/logout}" method="post">
        <button type="submit">退出登录</button>
    </form>
</main>
</body>
</html>
