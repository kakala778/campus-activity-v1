<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的报名 - 校园活动管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <h1>我的报名</h1>
    <p class="message" th:if="${success}" th:text="${success}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <p th:if="${#lists.isEmpty(registrations)}">当前没有报名记录。</p>
    <table th:unless="${#lists.isEmpty(registrations)}">
        <thead>
        <tr>
            <th>活动标题</th>
            <th>活动状态</th>
            <th>地点</th>
            <th>活动时间</th>
            <th>报名时间</th>
            <th>取消状态</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${registrations}">
            <td th:text="${item.registration.activity.title}">活动标题</td>
            <td th:text="${item.registration.activity.status}">PUBLISHED</td>
            <td th:text="${item.registration.activity.location}">活动地点</td>
            <td>
                <span th:text="${#temporals.format(item.registration.activity.startTime, 'yyyy-MM-dd HH:mm')}"></span>
                至
                <span th:text="${#temporals.format(item.registration.activity.endTime, 'yyyy-MM-dd HH:mm')}"></span>
            </td>
            <td th:text="${#temporals.format(item.registration.registeredAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <form th:if="${item.cancellable}"
                      th:action="@{/student/registrations/{activityId}/cancel(activityId=${item.registration.activity.id})}"
                      method="post">
                    <button type="submit">取消报名</button>
                </form>
                <span th:unless="${item.cancellable}">不可取消</span>
            </td>
        </tr>
        </tbody>
    </table>

    <p><a th:href="@{/student/activities}">返回活动列表</a></p>
</main>
</body>
</html>
